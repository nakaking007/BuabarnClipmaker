    <style>
        body { font-family: sans-serif; background: #f0f4f1; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin:0; }

        button:hover { background: #1b5e20; }
        .err { color: red; margin-top: 12px; text-align: center; display: none; }

</head>
<body>
    <div class="box">

        <div class="g"><label>รหัสผ่าน</label><input type="password" id="p" placeholder="123456"></div>

    </div>
<script>
const users = { admin:"123456", user1:"123456" };
const K = "buabarn_user";
if (sessionStorage.getItem(K)) location.href = "create.html";
function login() {
    let u = document.getElementById("u").value.trim();
    let p = document.getElementById("p").value.trim();
    if (users[u] && users[u] === p) {
